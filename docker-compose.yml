# Any box you own (a VPS, a home server, a Synology):
#   docker compose up -d   ->  http://<that box>:5173
# Put a reverse proxy with HTTPS in front before exposing it to the internet.
services:
  journal:
    build: .
    restart: unless-stopped
    ports:
      - "5173:8080"
    volumes:
      - ./data:/data
    environment:
      # set this to invite anyone else; leave unset and the first account closes signup
      # SIGNUP_CODE: "something-only-you-know"
      DATA_DIR: /data
