# fly.io deploy: a public HTTPS URL, always on, data kept on a volume.
#   fly launch --no-deploy --copy-config    (claims an app name)
#   fly volumes create journal_data --size 3
#   fly deploy
app = "journal-jack"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"

# SQLite means one machine owns the file — never scale this past one.
[[mounts]]
  source = "journal_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
